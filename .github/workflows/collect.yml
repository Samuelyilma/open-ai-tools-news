name: Collect open-source news

# Daily collection of open-source AI tools, agents, and models.
# Runs at 00:00 UTC every day; also triggerable manually from the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# The built-in GITHUB_TOKEN is enough — it has contents: write scoped to this
# repository, so the workflow can commit updated news.json + seen.json without
# a separate PAT. Do NOT reach for a personal access token here.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m collector.run collect

      - name: Commit and push updated data
        run: |
          git config user.name "open-ai-tools-news[bot]"
          git config user.email "41808188+github-actions[bot]@users.noreply.github.com"
          git add news.json seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update news.json ($(date -u +%Y-%m-%d))"
          git push
